<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit Search</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">
            <span>blink</span><b>it</b>
        </div>

        <!-- Search -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search for atta dal and more">
        </div>

        <!-- Cart -->
        <div class="cart">
            <i class="fa-solid fa-cart-shopping"></i>

            <div>
                <strong>1 item</strong>
                <p>₹351</p>
            </div>
        </div>

    </nav>


    <!-- Recent Searches -->
    <section class="recent">

        <div class="recent-head">
            <h3>Recent searches</h3>
            <a href="#">clear</a>
        </div>

        <div class="searches">
            <span>practical book</span>
            <span>paan corner</span>
            <span>paan corner rolling paper</span>
        </div>

    </section>

</body>
</html>
